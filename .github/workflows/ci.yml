name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Type check
        run: npm run typecheck

      - name: Lint code
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build extension and desktop app
        run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Chromium extension artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: animelens-extension-chromium
          path: dist/chromium/
          retention-days: 7

      - name: Upload Gecko extension artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: animelens-extension-gecko
          path: dist/gecko/
          retention-days: 7

      - name: Upload desktop app artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: animelens-desktop
          path: dist/electron/release/
          retention-days: 7
