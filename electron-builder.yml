appId: com.animelens.desktop
productName: AnimeLens
copyright: Copyright © Kikubay

directories:
  output: dist/electron/release

files:
  - dist/electron/app/**/*
  - package.json
  - '!node_modules/**/*'

extraMetadata:
  main: dist/electron/app/main.mjs

asar: true

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AnimeLens

mac:
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.entertainment

linux:
  icon: build/icon-512.png
  target:
    - AppImage
    - deb
  category: Network
  synopsis: MyAnimeList and AniList recommendations
  desktop:
    entry:
      Name: AnimeLens
  syncDesktopName: true
